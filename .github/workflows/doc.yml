name: doc
on:
  workflow_dispatch:
    inputs:
      manual:
        description: "Manual"
        type: choice
        required: true
        options:
          - 'guides'
      doc:
        description: "Doc name(s) — comma-separated for multiple (e.g. \"Search\" or \"Search, Indexes\")"
        type: string
        required: true
      order:
        description: "Order among Sibling Docs"
        type: string
      outputDir:
        description: "Output Directory"
        type: string
      recursive:
        description: "Recursive"
        type: boolean
        default: false
      staff:
        description: "Staff"
        type: string
        required: true
  repository_dispatch:
    types: [publish-doc]

jobs:
  fetch-doc-by-name:
    runs-on: ubuntu-latest
    env:
      DOC:       ${{ github.event.inputs.doc       || github.event.client_payload.doc }}
      MANUAL:    ${{ github.event.inputs.manual    || github.event.client_payload.manual    || 'guides' }}
      RECURSIVE: ${{ github.event.inputs.recursive || github.event.client_payload.recursive || 'false' }}
      ORDER:     ${{ github.event.inputs.order     || github.event.client_payload.order     || '' }}
      OUTPUT:    ${{ github.event.inputs.outputDir || github.event.client_payload.outputDir || '' }}
      STAFF:     ${{ github.event.inputs.staff     || github.event.client_payload.staff     || 'automation' }}
    steps:
      - name: get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - name: set up Environment
        uses: actions/setup-node@v4.0.1
      - name: checkout repo
        uses: actions/checkout@v4
      - name: install dependencies
        run: cd scripts && npm install
      - if: ${{ env.RECURSIVE == 'true' }}
        name: fetch multiple docs
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        run: |
          node scripts/report.js \
            -r "${{ secrets.RECEIVE_ID }}" \
            -m "🔥 Start building doc pages in [ ${{ env.DOC }} ] ..."
          IFS=',' read -ra DOCS <<< "${{ env.DOC }}"
          for doc in "${DOCS[@]}"; do
            doc=$(echo "$doc" | xargs)
            args=(-m ${{ env.MANUAL }} -d "$doc" -r)
            [ -n "${{ env.OUTPUT }}" ] && args+=(-o "${{ env.OUTPUT }}")
            [ -n "${{ env.ORDER }}" ]  && args+=(-p ${{ env.ORDER }})
            node scripts/index.js "${args[@]}"
          done
      - if: ${{ env.RECURSIVE != 'true' }}
        name: fetch a single doc
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        run: |
          node scripts/report.js \
            -r "${{ secrets.RECEIVE_ID }}" \
            -m "🔥 Start building doc page(s) [ ${{ env.DOC }} ] ..."
          IFS=',' read -ra DOCS <<< "${{ env.DOC }}"
          for doc in "${DOCS[@]}"; do
            doc=$(echo "$doc" | xargs)
            args=(-m ${{ env.MANUAL }} -d "$doc")
            [ -n "${{ env.OUTPUT }}" ] && args+=(-o "${{ env.OUTPUT }}")
            [ -n "${{ env.ORDER }}" ]  && args+=(-p ${{ env.ORDER }})
            node scripts/index.js "${args[@]}"
          done
      - name: sanitize staff name
        id: branch
        run: |
          ascii=$(echo "${{ env.STAFF }}" | sed 's/[^ -~]//g' | xargs)
          sanitized=$(echo "$ascii" | tr -cs 'a-zA-Z0-9-' '-' | sed 's/-*$//')
          echo "ascii=${ascii}" >> $GITHUB_OUTPUT
          echo "name=update-docs-${sanitized}" >> $GITHUB_OUTPUT
      - name: create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v4
        with:
          commit-message: "update doc ${{ env.DOC }} by name"
          title: "update doc ${{ env.DOC }} by name"
          body: "update doc ${{ env.DOC }} by name. ${{ steps.branch.outputs.ascii }} triggered this action."
          branch: ${{ steps.branch.outputs.name }}
      - name: check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          FEISHU_HOST: ${{ vars.FEISHU_HOST }}
          SPACE_ID: ${{ secrets.SPACE_ID }}
          FIGMA_API_KEY: ${{ secrets.FIGMA_API_KEY }}
        run: |
          node scripts/report.js \
            -r "${{ secrets.RECEIVE_ID }}" \
            -m "🔥 A PR has been ${{ steps.cpr.outputs.pull-request-operation }} at: #${{ steps.cpr.outputs.pull-request-url }}."
  failure:
    needs: fetch-doc-by-name
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: install dependencies
      run: cd scripts && npm install
    - name: report failure
      run: |
        node scripts/report.js \
          -r "${{ secrets.RECEIVE_ID }}" \
          -m "🔥 Build failed! Please check the logs."
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
  success:
    needs: fetch-doc-by-name
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: set up Environment
      uses: actions/setup-node@v4.0.1
    - name: checkout repo
      uses: actions/checkout@v4
    - name: install dependencies
      run: cd scripts && npm install
    - name: report success
      run: |
        node scripts/report.js \
          -r "${{ secrets.RECEIVE_ID }}" \
          -m "🔥 Build succeeds!"
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_SECRET: ${{ secrets.APP_SECRET }}
        FEISHU_HOST: ${{ vars.FEISHU_HOST }}
